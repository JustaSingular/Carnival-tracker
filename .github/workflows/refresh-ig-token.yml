# Instagram long-lived tokens expire 60 days after they are issued, which would
# silently stop the daily post two months in. Refreshing resets the clock, and
# only works while the token is still valid, so this runs weekly with plenty of
# room to survive a few failed attempts.
#
# Writing the new token back into the repository secret needs more power than
# the built-in GITHUB_TOKEN: create a fine-grained PAT scoped to this repository
# with Secrets: read and write, and store it as GH_PAT. Without it the job still
# reports the expiry, and you refresh by hand.
#
# Only applies to tokens from the Instagram Login flavour. Page access tokens
# obtained through Facebook Login do not expire and do not need this.

name: Refresh Instagram token

on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    env:
      # Job level so the `if` below can see it.
      GH_PAT: ${{ secrets.GH_PAT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh
        id: refresh
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node instagram.js refresh

      - name: Store the new token
        if: env.GH_PAT != ''
        env:
          # gh authenticates from GH_TOKEN; the new value is passed as an env
          # var rather than interpolated into the script, so it stays out of the
          # command line in this public log.
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW_TOKEN: ${{ steps.refresh.outputs.token }}
        run: gh secret set IG_ACCESS_TOKEN --body "$NEW_TOKEN"
